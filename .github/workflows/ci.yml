name: CI

on:
  push:
    branches: [main, develop, feature/**, fix/**]
    # Tag pushes (e.g. v1.2.3) trigger a GHCR image build with semver tags.
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs for the same branch+PR on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.run_number }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          # Core deps from pyproject.toml
          python -m pip install -e ".[schema,opendataloader]"

      - name: Install test extras
        run: |
          python -m pip install pytest pytest-cov

      - name: Run pytest with coverage
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov=rlpe --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.os }}
          path: coverage.xml

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: |
          ruff check src/ tests/ scripts/
      - name: Format check
        run: |
          ruff format --check src/ tests/ scripts/

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
      - name: Install mypy + deps
        run: |
          python -m pip install mypy
          python -m pip install -e ".[schema,opendataloader]"
      - name: Run mypy
        env:
          PYTHONPATH: src
        run: |
          mypy src/rlpe/ --ignore-missing-imports --no-strict-optional --no-warn-return-any

  eval-smoke:
    name: eval smoke (gold-set + 9-paper v16)
    runs-on: ubuntu-latest
    # The 9-paper v16 predictions (8 v13 + 1 new: beccaro2006;
    # bandini2006 removed — see work/bandini2006.jsonl.removed)
    # and gold set are committed to the repo, so a fresh checkout
    # can re-run the eval without re-running the full pipeline.
    # This guards against metric regressions in
    # parser/normalization changes.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[schema]"
      - name: Verify v16 predictions are present
        run: |
          test -f work/combined_9_v16_FINAL.jsonl
          test -f data/gold/bandini2011.jsonl
          test -f data/gold/baumgartner2008.jsonl
          test -f data/gold/beccaro2006.jsonl
          test -f data/gold/boughdiri2007.jsonl
          test -f data/gold/bragin2025.jsonl
          test -f data/gold/danelian2006.jsonl
          test -f data/gold/feng2007.jsonl
          test -f data/gold/hollis2006.jsonl
          test -f data/gold/pouille2014.jsonl
      - name: Run eval
        env:
          PYTHONPATH: src
        run: |
          python scripts/evaluate.py \
            --pred work/combined_9_v16_FINAL.jsonl \
            --gold data/gold/ \
            --output work/ci_eval.json
      - name: Assert aggregate F1 ≥ 95%
        env:
          PYTHONPATH: src
        run: |
          python -c "
          import json
          with open('work/ci_eval.json') as f:
              eval_data = json.load(f)
          f1 = eval_data['aggregate']['species_f1']
          pm = eval_data['aggregate']['panel_match_rate']
          assert f1 >= 0.95, f'aggregate F1 regressed: {f1:.4f} (must be >= 0.95)'
          assert pm >= 0.99, f'panel_match regressed: {pm:.4f} (must be >= 0.99)'
          print(f'PASS: aggregate F1 = {f1:.4f}, panel_match = {pm:.4f}')
          "

  docker:
    name: Build & push Docker image to GHCR
    runs-on: ubuntu-latest
    # Only build on push to main, develop, and tagged releases. PRs from
    # forks cannot access the GHCR token, so we skip the push step
    # there and only verify the image builds.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Semver tags for v*.*.* releases; SHA + branch tags otherwise.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=RLPE
            org.opencontainers.image.description=Radiolarian Literature Plate Extractor
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use the GitHub Actions cache to speed up repeat builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
