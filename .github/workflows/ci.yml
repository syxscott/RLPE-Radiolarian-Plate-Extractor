name: CI

on:
  push:
    branches: [main, develop, feature/**, fix/**]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs for the same branch+PR on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.run_number }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          # Core deps from pyproject.toml
          python -m pip install -e ".[schema,opendataloader]"

      - name: Install test extras
        run: |
          python -m pip install pytest pytest-cov

      - name: Run pytest with coverage
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov=rlpe --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.os }}
          path: coverage.xml

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: |
          ruff check src/ tests/ scripts/
      - name: Format check
        run: |
          ruff format --check src/ tests/ scripts/

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
      - name: Install mypy + deps
        run: |
          python -m pip install mypy
          python -m pip install -e ".[schema,opendataloader]"
      - name: Run mypy
        env:
          PYTHONPATH: src
        run: |
          mypy src/rlpe/ --ignore-missing-imports --no-strict-optional --no-warn-return-any

  eval-smoke:
    name: eval smoke (gold-set + 7-paper v12)
    runs-on: ubuntu-latest
    # The 7-paper v12 predictions and gold set are committed to the
    # repo, so a fresh checkout can re-run the eval without re-running
    # the full pipeline. This guards against metric regressions in
    # parser/normalization changes.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[schema]"
      - name: Verify v12 predictions are present
        run: |
          test -f work/combined_7_v12_FINAL.jsonl
          test -f data/gold/bandini2011.jsonl
          test -f data/gold/baumgartner2008.jsonl
          test -f data/gold/boughdiri2007.jsonl
          test -f data/gold/danelian2006.jsonl
          test -f data/gold/feng2007.jsonl
          test -f data/gold/hollis2006.jsonl
          test -f data/gold/pouille2014.jsonl
      - name: Run eval
        env:
          PYTHONPATH: src
        run: |
          python scripts/evaluate.py \
            --pred work/combined_7_v12_FINAL.jsonl \
            --gold data/gold/ \
            --output work/ci_eval.json
      - name: Assert aggregate F1 ≥ 90%
        env:
          PYTHONPATH: src
        run: |
          python -c "
          import json
          with open('work/ci_eval.json') as f:
              eval_data = json.load(f)
          f1 = eval_data['aggregate']['species_f1']
          pm = eval_data['aggregate']['panel_match_rate']
          assert f1 >= 0.90, f'aggregate F1 regressed: {f1:.4f} (must be >= 0.90)'
          assert pm >= 0.99, f'panel_match regressed: {pm:.4f} (must be >= 0.99)'
          print(f'PASS: aggregate F1 = {f1:.4f}, panel_match = {pm:.4f}')
          "
